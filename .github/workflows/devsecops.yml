name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  # ==========================================
  # CI JOB 1: SAST Scan (Semgrep)
  # ==========================================
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        # --exclude=".github" mencegah Semgrep memeriksa file workflow YAML
        run: semgrep scan --config auto --error --verbose --exclude=".github"

  # ==========================================
  # CI JOB 2: Code Quality (Pylint)
  # ==========================================
  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

  # ==========================================
  # CI JOB 3: Secret Scan (Gitleaks)
  # ==========================================
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wajib 0 agar Gitleaks dapat memindai seluruh histori commit/diff

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_CONFIG: .gitleaks.toml
        # Job otomatis gagal (exit code 1) jika ditemukan kebocoran rahasia

  # ==========================================
  # CI JOB 4: Test & Coverage (pytest + coverage)
  # ==========================================
  pytest-check:
    name: Pytest and Code Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        # Menjalankan pengujian, menampilkan baris yang belum ter-cover,
        # dan membatalkan pipeline jika coverage di bawah 80%
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  # ==========================================
  # CD STAGE: Deploy ke VM
  # ==========================================
  deploy-to-vm:
    name: Build & Deploy to VirtualBox VM
    needs: [sast-scan, pylint-check, gitleaks-scan, pytest-check] # Deploy hanya dieksekusi jika ke-4 job CI di atas lolos
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run Container
        run: |
          docker build -t secure-flask-app:latest .
          docker stop web-flask || true
          docker rm web-flask || true
          docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
          docker ps | grep web-flask