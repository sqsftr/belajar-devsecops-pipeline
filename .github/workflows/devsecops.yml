name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "pipeline/pylint-quality" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pylint-quality:
    name: Pylint Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; endif

      - name: Run Pylint
        run: |
          # Jalankan pylint pada direktori proyek (sesuaikan nama folder jika ada, misal src/ atau biarkan . untuk root)
          pylint **/*.py --fail-under=8.0